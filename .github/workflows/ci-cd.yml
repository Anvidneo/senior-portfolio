name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  sonarcloud:
    needs: [test]
    runs-on: ubuntu-latest
    # SONAR_TOKEN is stored as a secret of the "Production" environment.
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history improves SonarCloud's new-code/blame reporting.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage
        run: pnpm run test:coverage

      - name: Check that SONAR_TOKEN is available
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty. Add it as a secret named exactly SONAR_TOKEN in the Production environment or as a repository secret."
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan action only fails on a scanner error, not on a failed
      # Quality Gate. Without this step the deploy job would run anyway.
      - name: SonarCloud Quality Gate check
        id: quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail the job if the Quality Gate didn't pass
        if: steps.quality-gate-check.outputs.quality-gate-status != 'PASSED'
        run: |
          echo "Quality gate status: ${{ steps.quality-gate-check.outputs.quality-gate-status }}"
          exit 1

  deploy:
    name: Deploy (Vercel)
    needs: [test, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # VERCEL_TOKEN is stored as a secret of the "Production" environment.
    environment: Production
    env:
      # senior-portfolio project on Vercel. Identifiers, not secrets.
      VERCEL_ORG_ID: team_TZxnknKGtCRPnQKtQuuESXVG
      VERCEL_PROJECT_ID: prj_7NcK9QHHCds0zoNct3FlOGGMHoEr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Check that VERCEL_TOKEN is available
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is empty. Add it as a secret named exactly VERCEL_TOKEN in the Production environment or as a repository secret."
            exit 1
          fi
      # Vercel builds on its own servers, with the project settings and
      # vercel.json. A local `vercel build` + `--prebuilt` produced a
      # deployment without the prerendered pages (every route was a 404).
      - name: Deploy to production
        run: pnpm dlx vercel@latest deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"
