# SonarCloud project configuration (project already imported in the
# "anvidneo" organization). Two things live outside this file:
#   1. Administration > Analysis Method > turn OFF "Automatic Analysis", or
#      the CI scan is rejected while the automatic one is enabled.
#   2. The SONAR_TOKEN repository secret on GitHub.
# .github/workflows/ci-cd.yml runs the scan and waits for the Quality Gate.

sonar.projectKey=Anvidneo_senior-portfolio
sonar.organization=anvidneo
sonar.projectName=senior-portfolio
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,out/**,.next/**,coverage/**,src/app/icon.svg
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

# Written by `npm run test:coverage` (vitest, v8 provider) in CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Same files vitest leaves out of coverage (see vitest.config.mts): Next.js
# route entry points and next/font setup, which need a real build to run.
sonar.coverage.exclusions=src/app/**/layout.tsx,src/app/**/page.tsx,src/lib/fonts.ts

# Translation files mirror each other on purpose (same keys, different
# language), so they are not a duplication signal.
sonar.cpd.exclusions=src/messages/**
